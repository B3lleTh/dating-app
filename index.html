<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestros Lugares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>Nuestros Lugares</h1>
    <p class="tagline">"Por que quiero conocerte más, y seguir aprendiendo todo sobre ti ... "</p>
  </div>
  <div class="user-select">
    <label for="userName">Quién eres:</label>
    <select id="userName">
      <option value="Gil">Gil</option>
      <option value="Lili">Lili</option>
    </select>
  </div>
</header>

<main>

  <section class="add-place-card">
    <h2>Agregar lugar</h2>
    <form id="placeForm">
      <input type="text" id="placeName" placeholder="Nombre del lugar" required />
      <input type="text" id="placeImage" placeholder="Imagen (opcional, pega un link o déjalo así)" />
      <input type="url" id="placeLink" placeholder="Link / página (opcional)" />
      <select id="placeStatus">
        <option value="pendiente">Pendiente de ir</option>
        <option value="visitado">Ya fuimos</option>
      </select>
      <input type="date" id="placeDate" />
      <textarea id="placeReview" placeholder="Review / notas (opcional)"></textarea>
      <button type="submit">Agregar lugar</button>
    </form>
  </section>

  <section class="filters">
    <button class="filter-btn active" data-filter="todos">Todos</button>
    <button class="filter-btn" data-filter="pendiente">Pendientes</button>
    <button class="filter-btn" data-filter="visitado">Ya fuimos</button>
  </section>

  <section id="placesList" class="places-list">
    <p class="empty-msg">Cargando lugares...</p>
  </section>

  <section class="backup-tools">
    <button id="toggleBackup" class="link-toggle">Opciones avanzadas</button>
    <div id="backupPanel" class="backup-panel hidden">
      <button id="exportBtn">
        <svg viewBox="0 0 24 24" class="btn-icon" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v12m0 0 4-4m-4 4-4-4M5 19h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Descargar respaldo
      </button>
      <label class="import-label">
        <svg viewBox="0 0 24 24" class="btn-icon" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0 4 4m-4-4-4 4M5 19h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Importar respaldo
        <input type="file" id="importInput" accept="application/json" hidden />
      </label>
      <span id="backupStatus"></span>
    </div>
  </section>

</main>

<div id="confirmModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="confirmTitle">¿Eliminar este lugar?</h3>
    <p id="confirmMessage">Esta acción no se puede deshacer.</p>
    <div class="modal-actions">
      <button id="confirmCancel" class="modal-btn cancel">Cancelar</button>
      <button id="confirmAccept" class="modal-btn accept">Eliminar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- Firebase SDK (modular, via CDN) -->
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/dataService.js"></script>
<script type="module" src="js/backupService.js"></script>
<script type="module" src="js/uiService.js"></script>
<script type="module" src="js/modalService.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
